[project]
name = "english-buddy-backend"
version = "0.1.0"
description = "Little English Buddy - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "aiosqlite==0.21.0",
    "alembic==1.15.2",
    "groq==0.25.0",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-httpx==0.35.0",
    "httpx==0.28.1",
    "ruff==0.11.12",
    "mypy==1.15.0",
]
pg = [
    "asyncpg==0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
